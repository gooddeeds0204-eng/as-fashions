<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .wishlist-page { max-width: 1280px; margin: 0 auto; padding: 30px 24px 60px; }
  .wishlist-page h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 20px; }
  .empty-wishlist { text-align: center; padding: 60px 20px; }
  .empty-wishlist .btn-primary { display: inline-block; margin-top: 16px; }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="wishlist-page">
  <h1>Your Wishlist</h1>
  <div id="wishlistGrid" class="product-grid"></div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var wishApi = window.ASF.wishlist;
  var ui = window.ASF.ui;

  function render() {
    var products = wishApi.getProducts();
    var grid = document.getElementById('wishlistGrid');
    if (!products.length) {
      grid.innerHTML = '<div class="empty-wishlist" style="grid-column:1/-1;"><p style="font-size:16px;">Your wishlist is empty.</p><a href="index.html" class="btn btn-primary">Continue Shopping</a></div>';
      return;
    }
    ui.renderProductGrid('wishlistGrid', products);
  }

  window.addEventListener('asf:wishlist-updated', render);
  document.addEventListener('DOMContentLoaded', function () {
    render();
    ui.bindProductCardEvents(document.body);
  });
})();
</script>
</body>
</html>
