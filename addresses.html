<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Addresses — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="account-layout">
  <nav class="account-nav">
    <a href="profile.html">My Profile</a>
    <a href="orders.html">My Orders</a>
    <a href="addresses.html" class="active">Addresses</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="returns.html">Returns</a>
    <a href="help.html">Help</a>
  </nav>
  <div class="account-card">
    <h1>My Addresses <button id="addAddressBtn" class="btn-sm-like btn-add" style="padding:8px 14px; font-size:12px;">+ Add New</button></h1>
    <div id="addressList"></div>
    <div class="addr-form-fields" id="addrFormFields">
      <input type="hidden" id="addrId">
      <label>Full name</label><input type="text" id="addrName">
      <label>Address line</label><input type="text" id="addrLine">
      <div class="form-row-2">
        <div><label>City</label><input type="text" id="addrCity"></div>
        <div><label>PIN code</label><input type="text" id="addrPin"></div>
      </div>
      <label>Phone</label><input type="tel" id="addrPhone">
      <button id="saveAddrBtn" class="btn btn-primary" style="padding:10px 20px;">Save Address</button>
      <button id="cancelAddrBtn" class="btn-add" style="padding:10px 20px;">Cancel</button>
    </div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var authApi = window.ASF.auth;

  function render() {
    if (!authApi.isLoggedIn()) {
      document.querySelector('.account-card').innerHTML = '<p style="font-size:14px;">You need to be logged in to manage addresses.</p><a href="login.html" class="btn btn-primary" style="display:inline-block; margin-top:10px;">Login</a>';
      return;
    }
    var list = authApi.getAddresses();
    var el = document.getElementById('addressList');
    if (!list.length) {
      el.innerHTML = '<p style="font-size:13px; color:var(--ink-soft);">No saved addresses yet.</p>';
    } else {
      el.innerHTML = list.map(function (a) {
        return '<div class="address-item" data-id="' + a.id + '">' +
          '<p class="name">' + a.name + '</p>' +
          '<p>' + a.line + '</p>' +
          '<p>' + a.city + ' - ' + a.pin + '</p>' +
          '<p>Phone: ' + a.phone + '</p>' +
          '<div class="address-actions"><button class="edit-addr">Edit</button><button class="delete-addr danger">Delete</button></div>' +
        '</div>';
      }).join('');
      el.querySelectorAll('.edit-addr').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.closest('.address-item').dataset.id;
          var addr = list.find(function (a) { return a.id === id; });
          openForm(addr);
        });
      });
      el.querySelectorAll('.delete-addr').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var id = btn.closest('.address-item').dataset.id;
          if (confirm('Delete this address?')) { authApi.deleteAddress(id); render(); }
        });
      });
    }
  }

  function openForm(addr) {
    document.getElementById('addrFormFields').classList.add('open');
    document.getElementById('addrId').value = addr ? addr.id : '';
    document.getElementById('addrName').value = addr ? addr.name : '';
    document.getElementById('addrLine').value = addr ? addr.line : '';
    document.getElementById('addrCity').value = addr ? addr.city : '';
    document.getElementById('addrPin').value = addr ? addr.pin : '';
    document.getElementById('addrPhone').value = addr ? addr.phone : '';
  }

  document.getElementById('addAddressBtn').addEventListener('click', function () { openForm(null); });
  document.getElementById('cancelAddrBtn').addEventListener('click', function () {
    document.getElementById('addrFormFields').classList.remove('open');
  });
  document.getElementById('saveAddrBtn').addEventListener('click', function () {
    var id = document.getElementById('addrId').value;
    var data = {
      name: document.getElementById('addrName').value.trim(),
      line: document.getElementById('addrLine').value.trim(),
      city: document.getElementById('addrCity').value.trim(),
      pin: document.getElementById('addrPin').value.trim(),
      phone: document.getElementById('addrPhone').value.trim()
    };
    if (!data.name || !data.line || !data.city) { alert('Please fill in name, address, and city.'); return; }
    if (id) authApi.updateAddress(id, data);
    else authApi.addAddress(data);
    document.getElementById('addrFormFields').classList.remove('open');
    render();
  });

  render();
})();
</script>
</body>
</html>
