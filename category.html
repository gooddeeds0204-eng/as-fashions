<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/product.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="siteHeader"></div>

<div id="breadcrumb" class="breadcrumb"></div>

<div class="plp-layout">
  <aside class="filter-panel" id="filterPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h4 style="margin:0;">Filters</h4>
      <button id="clearFiltersBtn" class="filter-clear">Clear all</button>
    </div>
    <div class="filter-group">
      <h4>Gender</h4>
      <label><input type="checkbox" class="f-gender" value="men"> Men</label>
      <label><input type="checkbox" class="f-gender" value="women"> Women</label>
      <label><input type="checkbox" class="f-gender" value="kids"> Kids</label>
    </div>
    <div class="filter-group">
      <h4>Price</h4>
      <label><input type="radio" name="f-price" class="f-price" value=""> All</label>
      <label><input type="radio" name="f-price" class="f-price" value="0-999"> Under ₹999</label>
      <label><input type="radio" name="f-price" class="f-price" value="999-1999"> ₹999 – ₹1999</label>
      <label><input type="radio" name="f-price" class="f-price" value="1999-3999"> ₹1999 – ₹3999</label>
      <label><input type="radio" name="f-price" class="f-price" value="3999-99999"> Above ₹3999</label>
    </div>
    <div class="filter-group">
      <h4>Discount</h4>
      <label><input type="radio" name="f-discount" class="f-discount" value="0"> All</label>
      <label><input type="radio" name="f-discount" class="f-discount" value="20"> 20% and above</label>
      <label><input type="radio" name="f-discount" class="f-discount" value="40"> 40% and above</label>
    </div>
    <div class="filter-group" id="sizeFilterGroup">
      <h4>Size</h4>
      <div id="sizeOptions"></div>
    </div>
    <div class="filter-group" id="colorFilterGroup">
      <h4>Color</h4>
      <div id="colorOptions"></div>
    </div>
  </aside>

  <section>
    <button id="mobileFilterToggle" class="btn-add mobile-filter-toggle" style="margin-bottom:14px;">Filters &amp; Sort</button>
    <h1 class="plp-title" id="plpTitle">All Products</h1>
    <p class="plp-count" id="plpCount"></p>
    <div class="plp-toolbar">
      <div id="subcategoryChips" style="display:flex; gap:8px; flex-wrap:wrap;"></div>
      <select id="sortSelect">
        <option value="popularity">Popularity</option>
        <option value="newest">Newest</option>
        <option value="price-asc">Price: Low to High</option>
        <option value="price-desc">Price: High to Low</option>
        <option value="discount">Discount</option>
        <option value="rating">Customer Rating</option>
      </select>
    </div>
    <div id="plpGrid" class="product-grid"></div>
  </section>
</div>

<div class="drawer-backdrop" id="filterBackdrop" style="display:none;"></div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var catApi = window.ASF.categories;
  var prodApi = window.ASF.products;
  var filtApi = window.ASF.filters;
  var ui = window.ASF.ui;

  var state = { categoryId: null, special: null, query: null, gender: [], priceRange: null, minDiscount: 0, sizes: [], colors: [], sort: 'popularity', subcat: null };

  function baseList() {
    if (state.query) return prodApi.searchProducts(state.query);
    if (state.special === 'new') return prodApi.getNewArrivals();
    if (state.special === 'bestsellers') return prodApi.getBestsellers();
    if (state.special === 'sale') return prodApi.getSaleProducts();
    if (state.subcat) return prodApi.getProductsByCategory(state.subcat);
    if (state.categoryId) return prodApi.getProductsByCategory(state.categoryId);
    return prodApi.getAllProducts();
  }

  function renderBreadcrumb() {
    var el = document.getElementById('breadcrumb');
    if (state.categoryId) {
      var crumbs = catApi.getBreadcrumbs(state.categoryId);
      el.innerHTML = '<a href="index.html">Home</a> ' + crumbs.map(function (c) {
        return ' &rsaquo; <a href="category.html?cat=' + encodeURIComponent(c.id) + '">' + c.name + '</a>';
      }).join('');
    } else if (state.query) {
      el.innerHTML = '<a href="index.html">Home</a> &rsaquo; Search results';
    } else {
      el.innerHTML = '<a href="index.html">Home</a> &rsaquo; ' + (state.special ? state.special.charAt(0).toUpperCase() + state.special.slice(1) : 'All Products');
    }
  }

  function renderTitle(count) {
    var titleEl = document.getElementById('plpTitle');
    var countEl = document.getElementById('plpCount');
    if (state.categoryId) {
      var entry = catApi.getCategoryById(state.subcat || state.categoryId);
      titleEl.textContent = entry ? entry.name : 'Products';
    } else if (state.query) {
      titleEl.textContent = 'Results for "' + state.query + '"';
    } else if (state.special) {
      titleEl.textContent = state.special === 'new' ? 'New Arrivals' : state.special === 'bestsellers' ? 'Bestsellers' : 'Sale';
    } else {
      titleEl.textContent = 'All Products';
    }
    countEl.textContent = count + ' item' + (count === 1 ? '' : 's');
  }

  function renderSubcategoryChips() {
    var wrap = document.getElementById('subcategoryChips');
    wrap.innerHTML = '';
    if (!state.categoryId) return;
    var children = catApi.getChildren(state.categoryId);
    if (!children.length) return;
    var allChip = document.createElement('button');
    allChip.className = 'subcat-chip' + (!state.subcat ? ' active' : '');
    allChip.textContent = 'All';
    allChip.addEventListener('click', function () { state.subcat = null; refresh(); });
    wrap.appendChild(allChip);
    children.forEach(function (c) {
      var chip = document.createElement('button');
      chip.className = 'subcat-chip' + (state.subcat === c.id ? ' active' : '');
      chip.textContent = c.name;
      chip.addEventListener('click', function () { state.subcat = c.id; refresh(); });
      wrap.appendChild(chip);
    });
  }

  function renderFacetOptions(list) {
    var facets = filtApi.getFacets(list);
    var sizeBox = document.getElementById('sizeOptions');
    var colorBox = document.getElementById('colorOptions');
    sizeBox.innerHTML = facets.sizes.map(function (s) {
      return '<label><input type="checkbox" class="f-size" value="' + s + '"' + (state.sizes.indexOf(s) !== -1 ? ' checked' : '') + '> ' + s + '</label>';
    }).join('');
    colorBox.innerHTML = facets.colors.map(function (c) {
      return '<label><input type="checkbox" class="f-color" value="' + c + '"' + (state.colors.indexOf(c) !== -1 ? ' checked' : '') + '> ' + c + '</label>';
    }).join('');
    sizeBox.querySelectorAll('.f-size').forEach(function (cb) {
      cb.addEventListener('change', function () {
        state.sizes = Array.from(sizeBox.querySelectorAll('.f-size:checked')).map(function (i) { return i.value; });
        renderResults();
      });
    });
    colorBox.querySelectorAll('.f-color').forEach(function (cb) {
      cb.addEventListener('change', function () {
        state.colors = Array.from(colorBox.querySelectorAll('.f-color:checked')).map(function (i) { return i.value; });
        renderResults();
      });
    });
  }

  function renderResults() {
    var list = baseList();

    if (state.gender.length) list = list.filter(function (p) { return state.gender.indexOf(p.gender) !== -1; });
    var filterState = { sort: state.sort, sizes: state.sizes, colors: state.colors, minDiscount: state.minDiscount };
    if (state.priceRange) {
      var parts = state.priceRange.split('-');
      filterState.priceMin = Number(parts[0]);
      filterState.priceMax = Number(parts[1]);
    }
    var filtered = filtApi.applyFilters(list, filterState);

    renderTitle(filtered.length);
    var grid = document.getElementById('plpGrid');
    if (!filtered.length) {
      grid.innerHTML = '<p class="empty-plp">No products match these filters. Try clearing some.</p>';
    } else {
      ui.renderProductGrid('plpGrid', filtered);
    }
  }

  function refresh() {
    renderBreadcrumb();
    renderSubcategoryChips();
    renderFacetOptions(baseList());
    renderResults();
  }

  function readUrlParams() {
    var params = new URLSearchParams(window.location.search);
    state.categoryId = params.get('cat');
    state.special = params.get('filter');
    state.query = params.get('q');
  }

  function bindFilterEvents() {
    document.querySelectorAll('.f-gender').forEach(function (cb) {
      cb.addEventListener('change', function () {
        state.gender = Array.from(document.querySelectorAll('.f-gender:checked')).map(function (i) { return i.value; });
        renderResults();
      });
    });
    document.querySelectorAll('.f-price').forEach(function (rb) {
      rb.addEventListener('change', function () {
        state.priceRange = rb.value || null;
        renderResults();
      });
    });
    document.querySelectorAll('.f-discount').forEach(function (rb) {
      rb.addEventListener('change', function () {
        state.minDiscount = Number(rb.value) || 0;
        renderResults();
      });
    });
    document.getElementById('sortSelect').addEventListener('change', function (e) {
      state.sort = e.target.value;
      renderResults();
    });
    document.getElementById('clearFiltersBtn').addEventListener('click', function () {
      state.gender = []; state.priceRange = null; state.minDiscount = 0; state.sizes = []; state.colors = [];
      document.querySelectorAll('.f-gender').forEach(function (cb) { cb.checked = false; });
      document.querySelectorAll('.f-price').forEach(function (rb) { rb.checked = rb.value === ''; });
      document.querySelectorAll('.f-discount').forEach(function (rb) { rb.checked = rb.value === '0'; });
      refresh();
    });
    document.getElementById('mobileFilterToggle').addEventListener('click', function () {
      document.getElementById('filterPanel').classList.add('open');
      document.getElementById('filterBackdrop').style.display = 'block';
    });
    document.getElementById('filterBackdrop').addEventListener('click', function () {
      document.getElementById('filterPanel').classList.remove('open');
      document.getElementById('filterBackdrop').style.display = 'none';
    });
  }

  function init() {
    readUrlParams();
    bindFilterEvents();
    window.ASF.ui.bindProductCardEvents(document.body);
    refresh();
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
