<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products — AS FASHIONS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/product.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="siteHeader"></div>

  <nav class="breadcrumb" id="plpBreadcrumb"><a href="index.html">Home</a> / <span>All Products</span></nav>

  <main class="plp-layout">
    <!-- Sidebar Filters -->
    <aside class="filter-panel" id="filterPanel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="margin: 0; font-size: 15px; font-weight: 700;">Filters</h3>
        <button id="clearFiltersBtn" class="filter-clear">Clear All</button>
      </div>

      <div class="filter-group">
        <h4>Gender</h4>
        <label><input type="radio" name="filterGender" value="" checked> All</label>
        <label><input type="radio" name="filterGender" value="men"> Men</label>
        <label><input type="radio" name="filterGender" value="women"> Women</label>
        <label><input type="radio" name="filterGender" value="kids"> Kids</label>
      </div>

      <div class="filter-group">
        <h4>Price Range</h4>
        <label><input type="checkbox" name="filterPrice" value="0-999"> Under ₹999</label>
        <label><input type="checkbox" name="filterPrice" value="1000-1999"> ₹1,000 - ₹1,999</label>
        <label><input type="checkbox" name="filterPrice" value="2000-2999"> ₹2,000 - ₹2,999</label>
        <label><input type="checkbox" name="filterPrice" value="3000-99999"> ₹3,000 &amp; Above</label>
      </div>

      <div class="filter-group">
        <h4>Discount</h4>
        <label><input type="radio" name="filterDiscount" value="0" checked> All</label>
        <label><input type="radio" name="filterDiscount" value="20"> 20% and above</label>
        <label><input type="radio" name="filterDiscount" value="30"> 30% and above</label>
        <label><input type="radio" name="filterDiscount" value="50"> 50% and above</label>
      </div>
    </aside>

    <!-- Products Content -->
    <section>
      <div class="plp-toolbar">
        <div>
          <h1 id="plpTitle" class="plp-title">Collection</h1>
          <p id="plpCount" class="plp-count">Showing products</p>
        </div>
        <div>
          <select id="plpSort">
            <option value="popularity">Sort by: Popularity</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="discount">Better Discount</option>
            <option value="rating">Customer Rating</option>
          </select>
        </div>
      </div>

      <div id="categoryProductGrid" class="product-grid"></div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="js/categories.js"></script>
  <script src="js/products.js"></script>
  <script src="js/offers.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/search.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header.js"></script>
  <script src="js/category.js"></script>
</body>
</html>
