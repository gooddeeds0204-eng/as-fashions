<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="checkout-page">
  <div>
    <h1>Checkout</h1>
    <div id="savedAddresses"></div>
    <form class="checkout-form" id="checkoutForm">
      <label>Full name</label>
      <input type="text" id="ckName" required>
      <label>Address</label>
      <input type="text" id="ckLine" required>
      <div class="form-row-2">
        <div><label>City</label><input type="text" id="ckCity" required></div>
        <div><label>PIN code</label><input type="text" id="ckPin" required></div>
      </div>
      <label>Phone</label>
      <input type="tel" id="ckPhone" required>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:13px; margin-top:8px;">Continue to Payment</button>
    </form>
  </div>
  <aside class="order-summary">
    <h3>Order Summary</h3>
    <div id="checkoutLines"></div>
    <div class="summary-row"><span>Shipping</span><span id="checkoutShipping">Free</span></div>
    <div class="summary-row total"><span>Total</span><span id="checkoutTotal">₹0</span></div>
  </aside>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
