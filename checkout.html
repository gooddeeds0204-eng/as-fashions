<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .checkout-page { max-width: 900px; margin: 0 auto; padding: 30px 24px 60px; display: grid; grid-template-columns: 1fr 300px; gap: 32px; align-items: start; }
  .checkout-page h1 { font-family: var(--font-display); font-size: 26px; margin: 0 0 8px; }
  .demo-note { font-size: 12px; color: var(--ink-soft); background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 20px; }
  .checkout-form label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin-bottom: 4px; }
  .checkout-form input, .checkout-form select { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; margin-bottom: 14px; font-family: inherit; }
  .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .order-summary { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; position: sticky; top: 84px; }
  .order-summary h3 { font-family: var(--font-display); font-size: 18px; margin: 0 0 16px; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; color: var(--ink-soft); }
  .summary-row.total { font-size: 15px; font-weight: 700; color: var(--ink); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 8px; }
  @media (max-width: 760px) { .checkout-page { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="checkout-page">
  <div>
    <h1>Checkout</h1>
    <div class="demo-note">This is a demo checkout — no payment is processed. Connect a real payment gateway (Razorpay, Stripe, etc.) via a backend before going live.</div>
    <form class="checkout-form" id="checkoutForm">
      <label>Full name</label>
      <input type="text" required>
      <label>Address</label>
      <input type="text" required>
      <div class="form-row-2">
        <div><label>City</label><input type="text" required></div>
        <div><label>PIN code</label><input type="text" required></div>
      </div>
      <label>Phone</label>
      <input type="tel" required>
      <label>Payment method</label>
      <select>
        <option>Cash on Delivery</option>
        <option>UPI</option>
        <option>Card</option>
      </select>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:13px; margin-top:8px;">Place Order</button>
    </form>
  </div>
  <aside class="order-summary">
    <h3>Order Summary</h3>
    <div id="checkoutLines"></div>
    <div class="summary-row total"><span>Total</span><span id="checkoutTotal">₹0</span></div>
  </aside>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var cartApi = window.ASF.cart;
  var ui = window.ASF.ui;

  function render() {
    var summary = cartApi.getSummary();
    var linesEl = document.getElementById('checkoutLines');
    linesEl.innerHTML = summary.lines.map(function (line) {
      if (!line.product) return '';
      return '<div class="summary-row"><span>' + line.product.name + ' x' + line.qty + '</span><span>' + ui.money(line.lineTotal) + '</span></div>';
    }).join('');
    var shipping = summary.subtotal >= 999 ? 0 : 79;
    document.getElementById('checkoutTotal').textContent = ui.money(summary.subtotal + shipping);
  }

  document.getElementById('checkoutForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var summary = cartApi.getSummary();
    if (!summary.lines.length) { alert('Your bag is empty.'); return; }
    alert('Demo order placed! (No real payment was processed — connect a backend + payment gateway to accept real orders.)');
    cartApi.clearCart();
    window.location.href = 'index.html';
  });

  window.addEventListener('asf:cart-updated', render);
  document.addEventListener('DOMContentLoaded', render);
})();
</script>
</body>
</html>
