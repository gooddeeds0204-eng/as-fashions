<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Help &amp; Support — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="help-page">
  <h1>Help &amp; Support</h1>
  <div id="faqList"></div>

  <div class="contact-card">
    <h2>Still need help? Contact us</h2>
    <form id="contactForm">
      <input type="text" placeholder="Your name" required>
      <input type="email" placeholder="Your email" required>
      <textarea rows="4" placeholder="How can we help?" required></textarea>
      <button type="submit" class="btn btn-primary" style="padding:11px 24px;">Send Message</button>
    </form>
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var FAQS = [
    { q: 'How do I track my order?', a: 'Go to My Orders from your profile menu and click on any order to see its live tracking timeline.' },
    { q: 'What is your return policy?', a: 'Most items can be returned within 15 days of delivery. Go to Returns from your profile to start a request.' },
    { q: 'How long does delivery take?', a: 'Standard delivery takes 3-7 business days depending on your location.' },
    { q: 'Do you offer cash on delivery?', a: 'Yes, Cash on Delivery is available for most pin codes at checkout.' },
    { q: 'How do I cancel an order?', a: 'Orders can be cancelled from the order tracking page before they are shipped.' },
    { q: 'Is my payment information secure?', a: 'This demo site does not process real payments. On a live version, payments would be handled by a certified payment gateway.' }
  ];

  var el = document.getElementById('faqList');
  el.innerHTML = FAQS.map(function (f, i) {
    return '<div class="faq-item" data-idx="' + i + '">' +
      '<div class="faq-question">' + f.q + '<span class="faq-toggle">+</span></div>' +
      '<div class="faq-answer"><p>' + f.a + '</p></div>' +
    '</div>';
  }).join('');

  el.querySelectorAll('.faq-item').forEach(function (item) {
    item.querySelector('.faq-question').addEventListener('click', function () {
      item.classList.toggle('open');
    });
  });

  document.getElementById('contactForm').addEventListener('submit', function (e) {
    e.preventDefault();
    alert('Thanks for reaching out! (Demo — connect a real form backend/email service to receive these.)');
    e.target.reset();
  });
})();
</script>
</body>
</html>
