<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Fashions - Elevate Your Style</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; color: #333; }
        
        /* Fixed Header */
        header { background: #111; color: #fff; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        header h1 { font-size: 1.2rem; letter-spacing: 1px; font-weight: bold; }
        nav { display: flex; gap: 12px; }
        nav a { color: #fff; text-decoration: none; font-size: 0.8rem; }

        /* Hero Section */
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=800') no-repeat center center/cover; height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 15px; }
        .hero h2 { font-size: 1.8rem; margin-bottom: 8px; }
        .hero p { font-size: 0.9rem; margin-bottom: 15px; }
        .btn { background: #fff; color: #111; padding: 8px 18px; text-decoration: none; font-weight: bold; font-size: 0.85rem; border-radius: 4px; }

        /* Container & Grid */
        .container { max-width: 1200px; margin: 20px auto; padding: 0 10px; }
        .section-title { text-align: center; margin-bottom: 20px; font-size: 1.4rem; color: #222; }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media(min-width: 768px) { .products-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; } }

        /* Product Card */
        .product-card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; padding-bottom: 12px; }
        .product-card img { width: 100%; height: 180px; object-fit: cover; }
        @media(min-width: 768px) { .product-card img { height: 260px; } }
        
        .product-info { padding: 10px; text-align: center; }
        .product-card h3 { font-size: 0.9rem; margin-bottom: 5px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .product-card p { color: #b12704; font-weight: bold; font-size: 0.95rem; margin-bottom: 10px; }
        
        .cart-btn { background: #111; color: white; border: none; padding: 8px; width: 90%; margin: 0 auto; cursor: pointer; border-radius: 4px; font-size: 0.8rem; font-weight: bold; display: block; }
        .cart-btn:active { background: #333; }

        /* Footer */
        footer { background: #111; color: #fff; text-align: center; padding: 15px; margin-top: 30px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <h1>AS FASHIONS</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="hero">
        <h2>Elevate Your Style</h2>
        <p>Discover the latest trends in exclusive fashion.</p>
        <a href="#" class="btn">SHOP NOW</a>
    </div>

    <div class="container">
        <h2 class="section-title">Trending Collection</h2>
        <div class="products-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500" alt="Dress">
                <div class="product-info">
                    <h3>Floral Maxi Dress</h3>
                    <p>₹1,999</p>
                </div>
                <button class="cart-btn">Add to Cart</button>
            </div>
            
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=500" alt="Outfit">
                <div class="product-info">
                    <h3>Chic Casual Wear</h3>
                    <p>₹1,499</p>
                </div>
                <button class="cart-btn">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500" alt="Party Dress">
                <div class="product-info">
                    <h3>Evening Gown</h3>
                    <p>₹2,499</p>
                </div>
                <button class="cart-btn">Add to Cart</button>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=500" alt="Denim Jacket">
                <div class="product-info">
                    <h3>Denim Jacket</h3>
                    <p>₹1,799</p>
                </div>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 AS Fashions. All Rights Reserved.</p>
    </footer>

</body>
</html>
