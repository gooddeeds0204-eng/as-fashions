<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AS Fashions — Luxury Fashion Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080808;
    --card:#121212;
    --card2:#181818;
    --border:#292929;
    --text:#f5f5f5;
    --muted:#999;
    --gold:#d4af37;
    --green:#35d07f;
    --red:#ff416c;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.4;
}

button,
input,
select{
    font-family:inherit;
}

button{
    cursor:pointer;
}

/* ================= HEADER ================= */

header{
    height:62px;
    background:#101010;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    position:sticky;
    top:0;
    z-index:5000;
}

.logo{
    color:var(--gold);
    font-size:21px;
    font-weight:900;
    letter-spacing:3px;
    white-space:nowrap;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:18px;
}

.header-action{
    color:#ddd;
    font-size:13px;
    background:none;
    border:0;
}

.header-action:hover{
    color:var(--gold);
}

.cart-badge,
.wishlist-badge{
    color:var(--gold);
    font-weight:800;
}

.account-menu{
    position:relative;
}

.account-dropdown{
    display:none;
    position:absolute;
    right:0;
    top:38px;
    width:220px;
    background:#171717;
    border:1px solid var(--border);
    box-shadow:0 10px 35px #000;
    border-radius:8px;
    padding:8px;
    z-index:7000;
}

.account-dropdown.open{
    display:block;
}

.account-dropdown a,
.account-dropdown button{
    display:block;
    width:100%;
    padding:11px;
    text-align:left;
    color:#ddd;
    background:none;
    border:0;
    text-decoration:none;
    border-radius:5px;
}

.account-dropdown a:hover,
.account-dropdown button:hover{
    background:#252525;
    color:var(--gold);
}

/* ================= SEARCH ================= */

.search-panel{
    display:none;
    background:#111;
    padding:14px 20px;
    border-bottom:1px solid var(--border);
}

.search-panel.open{
    display:block;
}

.search-wrapper{
    max-width:850px;
    margin:auto;
    position:relative;
}

.search-input{
    width:100%;
    padding:14px 48px 14px 18px;
    background:#1b1b1b;
    color:white;
    border:1px solid #444;
    border-radius:6px;
    outline:none;
}

.search-input:focus{
    border-color:var(--gold);
}

.search-results{
    position:absolute;
    left:0;
    right:0;
    top:52px;
    background:#191919;
    border:1px solid #333;
    z-index:6000;
    display:none;
    max-height:350px;
    overflow:auto;
}

.search-results.open{
    display:block;
}

.search-result{
    padding:12px 15px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #292929;
}

.search-result:hover{
    background:#252525;
}

/* ================= NAV ================= */

.navbar{
    background:#151515;
    border-bottom:1px solid #272727;
    position:sticky;
    top:62px;
    z-index:4000;
}

.nav-scroll{
    max-width:1500px;
    margin:auto;
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
    padding:0 18px;
}

.nav-scroll::-webkit-scrollbar{
    display:none;
}

.nav-item{
    position:relative;
}

.nav-btn,
.nav-link{
    height:48px;
    display:flex;
    align-items:center;
    padding:0 15px;
    background:none;
    border:0;
    color:#ccc;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    letter-spacing:.7px;
    text-transform:uppercase;
    white-space:nowrap;
}

.nav-btn:hover,
.nav-link:hover{
    color:var(--gold);
}

.nav-btn.sale,
.nav-link.sale{
    color:var(--red);
}

.mega-menu{
    display:none;
    position:absolute;
    left:0;
    top:48px;
    width:720px;
    background:#151515;
    border:1px solid #333;
    box-shadow:0 20px 45px #000;
    padding:25px;
    grid-template-columns:repeat(4,1fr);
    gap:25px;
}

.nav-item.open .mega-menu{
    display:grid;
}

.mega-column h4{
    color:var(--gold);
    font-size:12px;
    margin-bottom:10px;
    text-transform:uppercase;
}

.mega-column a{
    display:block;
    color:#aaa;
    text-decoration:none;
    font-size:12px;
    margin:8px 0;
}

.mega-column a:hover{
    color:white;
    text-decoration:underline;
}

/* ================= MOBILE MENU ================= */

.mobile-menu-btn{
    display:none;
    background:none;
    border:0;
    color:white;
    font-size:22px;
}

/* ================= HERO ================= */

.hero{
    position:relative;
    height:480px;
    overflow:hidden;
}

.hero-slide{
    position:absolute;
    inset:0;
    opacity:0;
    transition:.6s;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.hero-slide.active{
    opacity:1;
}

.hero-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(
        90deg,
        rgba(0,0,0,.78),
        rgba(0,0,0,.25),
        rgba(0,0,0,.75)
    );
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:700px;
}

.hero-content .eyebrow{
    color:var(--gold);
    letter-spacing:4px;
    font-size:13px;
    font-weight:800;
}

.hero-content h2{
    font-size:52px;
    margin:12px 0;
    line-height:1;
}

.hero-content p{
    color:#ddd;
    margin-bottom:25px;
}

.gold-btn{
    background:var(--gold);
    color:#000;
    border:0;
    padding:13px 25px;
    border-radius:4px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
}

.gold-btn:hover{
    background:#f1ce52;
}

.hero-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,.4);
    border:1px solid #555;
    color:white;
    width:45px;
    height:55px;
    z-index:5;
    font-size:30px;
}

.hero-arrow:hover{
    color:var(--gold);
}

.hero-prev{
    left:20px;
}

.hero-next{
    right:20px;
}

.hero-dots{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:8px;
    z-index:5;
}

.hero-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#777;
}

.hero-dot.active{
    background:var(--gold);
}

/* ================= BENEFITS ================= */

.benefits{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-bottom:1px solid var(--border);
    background:#111;
}

.benefit{
    padding:18px;
    text-align:center;
    border-right:1px solid var(--border);
}

.benefit strong{
    display:block;
    color:white;
    font-size:13px;
}

.benefit span{
    color:#888;
    font-size:11px;
}

/* ================= CONTAINER ================= */

.container{
    max-width:1400px;
    margin:auto;
    padding:0 22px;
}

.section{
    margin-top:45px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:end;
    margin-bottom:18px;
}

.section-title{
    font-size:23px;
    font-weight:900;
    letter-spacing:.5px;
}

.section-subtitle{
    color:#888;
    font-size:12px;
    margin-top:4px;
}

.view-all{
    color:var(--gold);
    font-size:12px;
    text-decoration:none;
    font-weight:800;
}

/* ================= STORIES SECTION ================= */

.stories-scroll{
    display:flex;
    gap:15px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:5px;
}

.stories-scroll::-webkit-scrollbar{
    display:none;
}

.story-card{
    min-width:110px;
    height:180px;
    border-radius:10px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    border:2px solid var(--gold);
    flex-shrink:0;
    background-size:cover;
    background-position:center;
}

.story-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(transparent,rgba(0,0,0,.8));
    display:flex;
    align-items:end;
    padding:10px;
}

.story-overlay span{
    font-size:11px;
    font-weight:700;
    color:white;
}

/* ================= CATEGORY CARDS ================= */

.category-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
}

.category-card{
    height:150px;
    border-radius:7px;
    overflow:hidden;
    position:relative;
    cursor:pointer;
    border:1px solid #292929;
}

.category-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.category-card:hover img{
    transform:scale(1.08);
}

.category-overlay{
    position:absolute;
    inset:0;
    background:linear-gradient(transparent,rgba(0,0,0,.85));
    display:flex;
    align-items:end;
    padding:14px;
}

.category-overlay strong{
    font-size:14px;
}

/* ================= PRODUCT GRID ================= */

.products-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
}

.product-card{
    background:#121212;
    border:1px solid #252525;
    border-radius:7px;
    overflow:hidden;
    position:relative;
    transition:.25s;
}

.product-card:hover{
    transform:translateY(-4px);
    border-color:#555;
}

.product-image-wrap{
    position:relative;
    height:330px;
    overflow:hidden;
    background:#222;
}

.product-image{
    width:100%;
    height:100%;
    object-fit:cover;
    transition:.4s;
}

.product-card:hover .product-image{
    transform:scale(1.04);
}

.product-badge{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--red);
    color:white;
    font-size:10px;
    font-weight:900;
    padding:5px 8px;
    border-radius:3px;
}

.product-badge.green{
    background:var(--green);
    color:#000;
}

.wishlist-btn{
    position:absolute;
    top:9px;
    right:9px;
    width:34px;
    height:34px;
    border-radius:50%;
    border:0;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:17px;
}

.wishlist-btn.active{
    color:#ff416c;
}

.quick-btn{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    background:rgba(0,0,0,.82);
    color:white;
    border:0;
    padding:11px;
    transform:translateY(100%);
    transition:.25s;
    font-size:11px;
    font-weight:800;
}

.product-card:hover .quick-btn{
    transform:translateY(0);
}

.product-info{
    padding:13px;
}

.brand{
    color:var(--gold);
    font-size:10px;
    font-weight:900;
    text-transform:uppercase;
}

.product-name{
    color:#eee;
    font-size:13px;
    margin:4px 0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.rating{
    font-size:11px;
    color:#ddd;
    margin:6px 0;
}

.rating span{
    color:#ffd35a;
}

.price-row{
    display:flex;
    align-items:center;
    gap:8px;
}

.price{
    font-weight:900;
}

.mrp{
    color:#777;
    text-decoration:line-through;
    font-size:11px;
}

.discount{
    color:var(--green);
    font-size:11px;
    font-weight:800;
}

.add-btn{
    width:100%;
    background:var(--gold);
    color:#000;
    border:0;
    padding:11px;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

/* ================= BANNER GRID ================= */

.banner-grid{
    display:grid;
    grid-template-columns:2fr 1fr 1fr;
    gap:14px;
}

.banner{
    min-height:250px;
    position:relative;
    overflow:hidden;
    border-radius:8px;
    background-size:cover;
    background-position:center;
}

.banner-overlay{
    position:absolute;
    inset:0;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:end;
    background:linear-gradient(transparent,rgba(0,0,0,.85));
}

.banner h3{
    font-size:23px;
}

.banner p{
    color:#bbb;
    font-size:12px;
    margin:5px 0 12px;
}

/* ================= FILTER TOOLBAR ================= */

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.filter-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filter-btn,
.sort-select{
    background:#171717;
    color:#ccc;
    border:1px solid #333;
    padding:9px 12px;
    border-radius:4px;
    font-size:11px;
}

.filter-btn.active{
    color:var(--gold);
    border-color:var(--gold);
}

/* ================= DRAWER ================= */

.drawer{
    position:fixed;
    top:0;
    right:-430px;
    width:410px;
    max-width:100%;
    height:100vh;
    background:#121212;
    z-index:8000;
    transition:.3s;
    box-shadow:-10px 0 40px #000;
    border-left:1px solid var(--gold);
    display:flex;
    flex-direction:column;
}

.drawer.open{
    right:0;
}

.drawer-header{
    padding:18px;
    display:flex;
    justify-content:space-between;
    border-bottom:1px solid #333;
}

.drawer-header h3{
    color:var(--gold);
}

.close-btn{
    background:none;
    border:0;
    color:white;
    font-size:20px;
}

.drawer-body{
    flex:1;
    overflow:auto;
    padding:15px;
}

/* ================= CART ================= */

.cart-item{
    display:grid;
    grid-template-columns:70px 1fr auto;
    gap:10px;
    background:#191919;
    padding:10px;
    margin-bottom:10px;
    border-radius:6px;
}

.cart-item img{
    width:70px;
    height:85px;
    object-fit:cover;
}

.cart-item h4{
    font-size:12px;
}

.cart-item p{
    font-size:11px;
    color:#999;
    margin-top:5px;
}

.qty{
    display:flex;
    gap:7px;
    align-items:center;
    margin-top:8px;
}

.qty button{
    width:23px;
    height:23px;
    background:#292929;
    color:white;
    border:1px solid #444;
}

.remove{
    background:none;
    border:0;
    color:#ff416c;
    font-size:11px;
}

.cart-footer{
    padding:18px;
    border-top:1px solid #333;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
    font-size:13px;
}

.total{
    font-size:18px;
    font-weight:900;
    color:var(--gold);
}

/* ================= MODAL ================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.86);
    z-index:9000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.open{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:950px;
    max-height:90vh;
    overflow:auto;
    background:#151515;
    border:1px solid #444;
    border-radius:9px;
    position:relative;
}

.modal-close{
    position:absolute;
    top:12px;
    right:15px;
    background:#000;
    color:white;
    border:0;
    width:35px;
    height:35px;
    border-radius:50%;
    z-index:3;
}

.product-modal-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
}

.modal-image{
    width:100%;
    min-height:500px;
    height:100%;
    object-fit:cover;
}

.modal-details{
    padding:30px;
}

.modal-brand{
    color:var(--gold);
    font-size:12px;
    font-weight:900;
}

.modal-details h2{
    font-size:26px;
    margin:8px 0;
}

.modal-price{
    font-size:24px;
    font-weight:900;
}

.selector-title{
    font-size:11px;
    color:#888;
    margin-top:20px;
    margin-bottom:8px;
}

.selector{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.selector button{
    background:#1e1e1e;
    border:1px solid #444;
    color:white;
    padding:9px 14px;
    border-radius:4px;
}

.selector button.selected{
    border-color:var(--gold);
    color:var(--gold);
}

.modal-description{
    color:#999;
    font-size:13px;
    margin:20px 0;
}

.size-guide{
    color:var(--gold);
    font-size:11px;
    border:0;
    background:none;
    margin-left:8px;
}

.modal-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.outline-btn{
    background:none;
    border:1px solid var(--gold);
    color:var(--gold);
    padding:13px;
    font-weight:900;
}

/* ================= CHECKOUT ================= */

.checkout-grid{
    display:grid;
    grid-template-columns:1.4fr 1fr;
    gap:25px;
    padding:25px;
}

.form-title{
    color:var(--gold);
    margin-bottom:15px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    color:#aaa;
    font-size:11px;
    margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:11px;
    background:#1d1d1d;
    border:1px solid #333;
    color:white;
    border-radius:4px;
    outline:none;
}

.form-group input:focus,
.form-group textarea:focus{
    border-color:var(--gold);
}

.payment-option{
    display:block;
    padding:13px;
    border:1px solid #333;
    margin-bottom:8px;
    border-radius:5px;
    background:#191919;
}

.payment-option input{
    margin-right:8px;
}

/* ================= REVIEWS ================= */

.review{
    padding:12px 0;
    border-bottom:1px solid #292929;
}

.review strong{
    font-size:12px;
}

.review p{
    color:#999;
    font-size:12px;
    margin-top:4px;
}

/* ================= FOOTER ================= */

function productCard(product){
    const wished = wishlist.includes(product.id);
    return `
    <div class="product-card">
        <div class="product-image-wrap" onclick="openProduct(${product.id})">
            <img class="product-image" src="${product.image}" alt="${product.name}" loading="lazy">
            ${product.discount >= 50 ? `<div class="product-badge">${product.discount}% OFF</div>` : `<div class="product-badge green">TRENDING</div>`}
            <button class="wishlist-btn ${wished ? "active":""}" onclick="event.stopPropagation();toggleWishlist(${product.id})">${wished ? "♥":"♡"}</button>
            <button class="quick-btn" onclick="event.stopPropagation();openProduct(${product.id})">QUICK VIEW</button>
        </div>
        <div class="product-info">
            <div class="brand">${product.brand}</div>
            <div class="product-name">${product.name}</div>
            <div class="rating"><span>★★★★★</span>${product.rating}</div>
            <div class="price-row">
                <span class="price">₹${product.price.toLocaleString("en-IN")}</span>
                <span class="mrp">₹${product.mrp.toLocaleString("en-IN")}</span>
                <span class="discount">${product.discount}% OFF</span>
            </div>
        </div>
        <button class="add-btn" onclick="openProduct(${product.id})">SELECT OPTIONS</button>
    </div>`;
}

function renderProducts(){
    const allGrid = document.getElementById("allProductGrid");
    const trendGrid = document.getElementById("trendingProducts");
    const newGrid = document.getElementById("newProducts");
    const bestGrid = document.getElementById("bestProducts");
    const recGrid = document.getElementById("recommendedProducts");

    if(allGrid) allGrid.innerHTML = currentProducts.map(productCard).join("");
    if(trendGrid) trendGrid.innerHTML = products.filter(p=>p.trending).slice(0,4).map(productCard).join("");
    if(newGrid) newGrid.innerHTML = products.filter(p=>p.new).slice(0,4).map(productCard).join("");
    if(bestGrid) bestGrid.innerHTML = [...products].sort((a,b)=>b.rating-a.rating).slice(0,4).map(productCard).join("");
    if(recGrid) recGrid.innerHTML = [...products].sort(()=>Math.random()-.5).slice(0,4).map(productCard).join("");
    
    renderRecentlyViewed();
}

function filterProducts(category, button){
    currentFilter = category;
    if(category === "All"){
        currentProducts = [...products];
    } else {
        currentProducts = products.filter(p=>p.category === category);
    }
    document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
    if(button) button.classList.add("active");
    renderProducts();
    scrollToSection("allProducts");
}

function filterCategory(category){
    filterProducts(category, null);
    document.querySelectorAll(".filter-btn").forEach(btn=>{
        btn.classList.remove("active");
        if(btn.innerText.trim() === category) btn.classList.add("active");
    });
}

function sortProducts(type){
    let arr = [...currentProducts];
    if(type === "priceLow") arr.sort((a,b)=>a.price-b.price);
    if(type === "priceHigh") arr.sort((a,b)=>b.price-a.price);
    if(type === "discount") arr.sort((a,b)=>b.discount-a.discount);
    if(type === "rating") arr.sort((a,b)=>b.rating-a.rating);
    if(type === "newest") arr.sort((a,b)=>Number(b.new)-Number(a.new));
    currentProducts = arr;
    const allGrid = document.getElementById("allProductGrid");
    if(allGrid) allGrid.innerHTML = arr.map(productCard).join("");
}

function openProduct(id){
    const product = products.find(p=>p.id === id);
    if(!product) return;
    currentProduct = product;
    
    document.getElementById("modalImage").src = product.image;
    document.getElementById("modalBrand").innerText = product.brand;
    document.getElementById("modalTitle").innerText = product.name;
    document.getElementById("modalRating").innerText = " " + product.rating;
    document.getElementById("modalPrice").innerText = "₹" + product.price.toLocaleString("en-IN");
    document.getElementById("modalMRP").innerText = " ₹" + product.mrp.toLocaleString("en-IN");
    document.getElementById("modalDiscount").innerText = " " + product.discount + "% OFF";
    document.getElementById("modalDescription").innerText = product.description;

    let sizes = ["S", "M", "L", "XL", "XXL"];
    let sizeLabelText = "SELECT SIZE";

    if(product.category === "Kids"){
        sizes = ["2-3Y", "3-4Y", "5-6Y", "7-8Y", "9-10Y"];
        sizeLabelText = "SELECT AGE GROUP";
    } else if(product.category === "Footwear"){
        sizes = ["UK 6", "UK 7", "UK 8", "UK 9", "UK 10"];
        sizeLabelText = "SELECT SHOE SIZE (UK)";
    } else if(product.category === "Bags" || product.category === "Accessories" || product.category === "Beauty"){
        sizes = ["Standard Size"];
        sizeLabelText = "SIZE / CAPACITY";
    }

    document.getElementById("sizeLabel").innerHTML = `${sizeLabelText} <button class="size-guide">SIZE GUIDE</button>`;
    
    selectedSize = sizes[0];
    const sizeContainer = document.getElementById("sizeSelector");
    sizeContainer.innerHTML = sizes.map((sz, i)=>`<button class="${i===0?'selected':''}" onclick="selectSizeBtn(this)">${sz}</button>`).join("");

    document.getElementById("productModal").classList.add("open");

    if(!recentlyViewed.includes(id)){
        recentlyViewed.unshift(id);
        recentlyViewed = recentlyViewed.slice(0,6);
        saveState();
    }
    renderRecentlyViewed();
}

function closeProductModal(){
    document.getElementById("productModal").classList.remove("open");
}

function selectSizeBtn(btn){
    document.querySelectorAll("#sizeSelector button").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedSize = btn.innerText;
}

function selectColor(btn){
    document.querySelectorAll("#colorSelector button").forEach(b=>b.classList.remove("selected"));
    btn.classList.add("selected");
    selectedColor = btn.innerText;
}

function addModalToCart(){
    if(!currentProduct) return;
    const existing = cart.find(item => item.id === currentProduct.id && item.size === selectedSize && item.color === selectedColor);
    if(existing){
        existing.qty++;
    } else {
        cart.push({ id: currentProduct.id, size: selectedSize, color: selectedColor, qty: 1 });
    }
    saveState();
    updateCart();
    closeProductModal();
    openCart();
    toast("Added to shopping bag 🛍️");
}

function updateCart(){
    const countSpan = document.getElementById("cartCount");
    if(countSpan) countSpan.innerText = cart.reduce((sum,item)=>sum+item.qty,0);
    
    const container = document.getElementById("cartItems");
    if(!container) return;

    if(cart.length === 0){
        container.innerHTML = `<div style="text-align:center;padding:50px 15px;color:#777"><div style="font-size:40px">🛍️</div><p style="margin-top:10px">Your shopping bag is empty</p></div>`;
    } else {
        container.innerHTML = cart.map((item,index)=>{
            const p = products.find(x=>x.id === item.id);
            if(!p) return '';
            return `
            <div class="cart-item">
                <img src="${p.image}">
                <div>
                    <h4>${p.name}</h4>
                    <p>${p.brand}</p>
                    <p>Size: ${item.size}</p>
                    <p>Color: ${item.color}</p>
                    <div class="qty">
                        <button onclick="changeQty(${index},-1)">−</button>
                        <strong>${item.qty}</strong>
                        <button onclick="changeQty(${index},1)">+</button>
                    </div>
                </div>
                <div>
                    <strong style="color:var(--gold)">₹${(p.price*item.qty).toLocaleString("en-IN")}</strong><br>
                    <button class="remove" onclick="removeCart(${index})">Remove</button>
                </div>
            </div>`;
        }).join("");
    }
    updateCartSummary();
}

function changeQty(index,value){
    cart[index].qty += value;
    if(cart[index].qty <= 0) cart.splice(index,1);
    saveState();
    updateCart();
}

function removeCart(index){
    cart.splice(index,1);
    saveState();
    updateCart();
    toast("Item removed");
}

function updateCartSummary(){
    let subtotal = 0;
    cart.forEach(item=>{
        const p = products.find(x=>x.id === item.id);
        if(p) subtotal += p.price * item.qty;
    });
    const delivery = subtotal === 0 ? 0 : (subtotal >= 999 ? 0 : 79);
    const total = subtotal + delivery - couponDiscount;

    const subEl = document.getElementById("subtotal");
    const delEl = document.getElementById("delivery");
    const discEl = document.getElementById("cartDiscount");
    const totEl = document.getElementById("cartTotal");

    if(subEl) subEl.innerText = "₹" + subtotal.toLocaleString("en-IN");
    if(delEl) delEl.innerText = delivery === 0 ? "FREE" : "₹" + delivery;
    if(discEl) discEl.innerText = "₹" + couponDiscount;
    if(totEl) totEl.innerText = "₹" + Math.max(0,total).toLocaleString("en-IN");
}

function openCart(){ 
    const drawer = document.getElementById("cartDrawer");
    if(drawer) drawer.classList.add("open"); 
    updateCart(); 
}
function closeCart(){ 
    const drawer = document.getElementById("cartDrawer");
    if(drawer) drawer.classList.remove("open"); 
}

function toggleSearch(){

    panel.classList.toggle("open");

        const sInput = document.getElementById("searchInput");

function searchProducts(){
    const sInput = document.getElementById("searchInput");
    const results = document.getElementById("searchResults");
    if(!sInput || !results) return;

    const query = sInput.value.toLowerCase().trim();
    if(!query){ results.classList.remove("open"); return; }
    const matches = products.filter(p=>`${p.name} ${p.brand} ${p.category} ${p.type}`.toLowerCase().includes(query));
    results.innerHTML = matches.length ? matches.slice(0,8).map(p=>`<div class="search-result" onclick="openProduct(${p.id});closeSearchResults()"><span>${p.brand} — ${p.name}</span><strong>₹${p.price}</strong></div>`).join("") : `<div class="search-result">No products found</div>`;
    results.classList.add("open");
}

function closeSearchResults(){ 
    const res = document.getElementById("searchResults");
    if(res) res.classList.remove("open"); 
}

function openCheckout(){
    if(cart.length === 0){ toast("Your shopping bag is empty"); return; }
    closeCart();
    renderCheckout();
    const chkModal = document.getElementById("checkoutModal");
    if(chkModal) chkModal.classList.add("open");
}

function closeCheckout(){ 
    const chkModal = document.getElementById("checkoutModal");
    if(chkModal) chkModal.classList.remove("open"); 
}

function renderCheckout(){
    let subtotal = 0;
    const items = document.getElementById("checkoutItems");
    if(!items) return;

    items.innerHTML = cart.map(item=>{
        const p = products.find(x=>x.id === item.id);
        if(!p) return '';
        const amount = p.price * item.qty;
        subtotal += amount;
        return `<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #292929;font-size:11px;"><span>${p.name} × ${item.qty}</span><strong>₹${amount.toLocaleString("en-IN")}</strong></div>`;
    }).join("");

    const delivery = subtotal >= 999 ? 0 : 79;
    const total = Math.max(0, subtotal + delivery - couponDiscount);

    const cSub = document.getElementById("checkoutSubtotal");
    const cDel = document.getElementById("checkoutDelivery");
    const cDisc = document.getElementById("checkoutDiscount");
    const cTot = document.getElementById("checkoutTotal");

    if(cSub) cSub.innerText = "₹" + subtotal.toLocaleString("en-IN");
    if(cDel) cDel.innerText = delivery === 0 ? "FREE" : "₹" + delivery;
    if(cDisc) cDisc.innerText = "₹" + couponDiscount;
    if(cTot) cTot.innerText = "₹" + Math.max(0,total).toLocaleString("en-IN");
}

function applyCoupon(){
    const cInput = document.getElementById("couponInput");
    const cMsg = document.getElementById("couponMessage");
    if(!cInput) return;

    const code = cInput.value.trim().toUpperCase();
    let subtotal = cart.reduce((sum,item)=>{
        const p = products.find(x=>x.id === item.id);
        return sum + (p ? p.price * item.qty : 0);
    }, 0);

    if(code === "ASNEW10"){
        couponDiscount = Math.round(subtotal * .10);
        if(cMsg){ cMsg.style.color = "var(--green)"; cMsg.innerText = "Coupon applied! 10% discount 🎉"; }
    } else if(code === "WELCOME500"){
        couponDiscount = Math.min(500, subtotal);
        if(cMsg){ cMsg.style.color = "var(--green)"; cMsg.innerText = "₹500 discount applied! 🎉"; }
    } else {
        couponDiscount = 0;
        if(cMsg){ cMsg.style.color = "#ff416c"; cMsg.innerText = "Invalid coupon code"; }
    }
    renderCheckout();
    updateCartSummary();
}

function placeOrder(){
    const name = document.getElementById("checkoutName").value.trim();
    const phone = document.getElementById("checkoutPhone").value.trim();
    const address = document.getElementById("checkoutAddress").value.trim();
    const pin = document.getElementById("checkoutPin").value.trim();

    if(!name || !phone || !address || !pin){ toast("Please complete delivery details"); return; }
    if(phone.length !== 10){ toast("Enter a valid 10-digit mobile number"); return; }

    const orderId = "ASF" + Date.now().toString().slice(-7);
    
    let orderText = `*New Order Placed!* 🛍️%0A*Order ID:* ${orderId}%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Pincode:* ${pin}%0A*Address:* ${address}%0A%0A*Items:*%0A`;
    cart.forEach(item => {
        const p = products.find(x => x.id === item.id);
        if(p) orderText += `- ${p.name} (Size: ${item.size}, Color: ${item.color}) x ${item.qty}%0A`;
    });
    
    const totalAmountElem = document.getElementById("checkoutTotal");
    const totalAmount = totalAmountElem ? totalAmountElem.innerText : "₹0";
    orderText += `%0A*Total Payable:* ${totalAmount}`;

    let confirmWhatsApp = confirm(`Order Placed Successfully! 🎉\nOrder ID: ${orderId}\n\nClick OK to send order details directly via WhatsApp to the store owner.`);
    
    if(confirmWhatsApp){
        window.open(`https://wa.me/919999999999?text=${orderText}`, '_blank');
    }

    cart = [];
    couponDiscount = 0;
    saveState();
    updateCart();
    closeCheckout();
    toast("Order placed successfully 🎉");
}

let heroIndex = 0;
const heroSlides = document.querySelectorAll(".hero-slide");
const dotsContainer = document.getElementById("heroDots");

if(heroSlides.length > 0 && dotsContainer){
    heroSlides.forEach((_,i)=>{
        const dot = document.createElement("button");
        dot.className = "hero-dot " + (i === 0 ? "active":"");
        dot.onclick = ()=>showHero(i);
        dotsContainer.appendChild(dot);
    });
}

function showHero(index){
    if(heroSlides.length === 0) return;
    heroSlides.forEach(slide=>slide.classList.remove("active"));
    document.querySelectorAll(".hero-dot").forEach(dot=>dot.classList.remove("active"));
    heroIndex = (index + heroSlides.length) % heroSlides.length;
    heroSlides[heroIndex].classList.add("active");
    const dots = document.querySelectorAll(".hero-dot");
    if(dots[heroIndex]) dots[heroIndex].classList.add("active");
}

function changeHero(direction){ showHero(heroIndex + direction); }
if(heroSlides.length > 0){
    setInterval(()=>{ changeHero(1); }, 5000);
}

function scrollToSection(id){
    const el = document.getElementById(id);
    if(el) el.scrollIntoView({ behavior:"smooth" });
}

function toggleMobileNav(){

    if(nav) nav.classList.toggle("open");
