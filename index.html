<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS Fashions - Elevate Your Style</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { background: #111; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; }
        nav a { color: #fff; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
        .hero { background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?w=1200') no-repeat center center/cover; height: 350px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 1rem; }
        .hero h2 { font-size: 2.5rem; margin-bottom: 10px; }
        .btn { background: #fff; color: #111; padding: 10px 20px; text-decoration: none; font-weight: bold; border-radius: 4px; margin-top: 15px; }
        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        .section-title { text-align: center; margin-bottom: 30px; font-size: 1.8rem; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .product-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden; text-align: center; padding-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 280px; object-fit: cover; }
        .product-card h3 { margin: 15px 0 5px; font-size: 1.1rem; }
        .product-card p { color: #e44d26; font-weight: bold; font-size: 1rem; }
        .cart-btn { background: #111; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
        footer { background: #111; color: #fff; text-align: center; padding: 20px; margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <h1>AS FASHIONS</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">Shop</a>
            <a href="#">Collections</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <div class="hero">
        <h2>Elevate Your Style</h2>
        <p>Discover the latest trends in exclusive fashion.</p>
        <a href="#" class="btn">SHOP NOW</a>
    </div>

    <div class="container">
        <h2 class="section-title">Trending Collection</h2>
        <div class="products-grid">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=500" alt="Dress">
                <h3>Floral Maxi Dress</h3>
                <p>₹1,999</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=500" alt="Outfit">
                <h3>Chic Casual Wear</h3>
                <p>₹1,499</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=500" alt="Party Dress">
                <h3>Evening Gown</h3>
                <p>₹2,499</p>
                <button class="cart-btn">Add to Cart</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 AS Fashions. All Rights Reserved.</p>
    </footer>

</body>
</html>
