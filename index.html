<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AS FASHIONS — Wear Your World</title>
<meta name="description" content="AS FASHIONS — Men, Women & Kids fashion, footwear, bags and accessories.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="siteHeader"></div>

<section class="hero">
  <div class="hero-inner">
    <p class="hero-eyebrow">New Season Edit</p>
    <h1>Fashion that speaks<br>your language.</h1>
    <p>From everyday essentials to festive statements — Men, Women and Kids, all in one place.</p>
    <a href="shop.html?filter=new" class="btn btn-primary">Shop New Arrivals</a>
  </div>
</section>

<section class="section">
  <div class="section-head"><h2>Handpicked for you</h2></div>
  <div id="promoStrip" class="promo-strip"></div>
</section>

<section class="section">
  <div class="section-head"><h2>Shop by Category</h2></div>
  <div id="categoryRail" class="category-rail"></div>
</section>

<section id="new-arrivals" class="section">
  <div class="section-head"><h2>New Arrivals</h2><a href="shop.html?filter=new">View all</a></div>
  <div id="newArrivalsRail" class="product-rail"></div>
</section>

<section class="section">
  <div class="section-head"><h2>Bestsellers</h2><a href="shop.html?filter=bestsellers">View all</a></div>
  <div id="bestsellersRail" class="product-rail"></div>
</section>

<section id="sale" class="section">
  <div class="section-head"><h2>Sale — Up to 50% Off</h2><a href="shop.html?filter=sale">View all</a></div>
  <div id="saleRail" class="product-rail"></div>
</section>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script src="js/app.js"></script>
</body>
</html>
