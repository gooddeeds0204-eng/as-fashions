<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS FASHIONS | Online Fashion Shopping</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header Section -->
    <header class="navbar">
        <div class="logo">AS FASHIONS</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="pages/men.html">Men</a>
            <a href="pages/women.html">Women</a>
            <a href="pages/kids.html">Kids</a>
            <a href="pages/footwear.html">Footwear</a>
            <a href="pages/accessories.html">Accessories</a>
        </nav>
        <div class="nav-actions">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for products, brands and more">
            </div>
            <a href="pages/wishlist.html"><i class="fa-regular fa-heart"></i><span class="badge">0</span></a>
            <a href="pages/cart.html"><i class="fa-solid fa-bag-shopping"></i><span class="badge">0</span></a>
            <a href="pages/profile.html"><i class="fa-regular fa-user"></i></a>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Hero Banner Section -->
        <section class="hero-banner">
            <div class="banner-content">
                <h1>SUMMER SALE</h1>
                <p>UP TO 50% OFF ON NEW ARRIVALS</p>
                <button class="shop-btn">SHOP NOW</button>
            </div>
        </section>

        <!-- Categories Section -->
        <section class="categories-section">
            <h2>SHOP BY CATEGORY</h2>
            <div class="category-grid" id="categoryGrid">
                <!-- Dynamically loaded or static cards -->
                <div class="cat-card">Men</div>
                <div class="cat-card">Women</div>
                <div class="cat-card">Kids</div>
                <div class="cat-card">Footwear</div>
                <div class="cat-card">Accessories</div>
                <div class="cat-card">Beauty</div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 AS FASHIONS. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
