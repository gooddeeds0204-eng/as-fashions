<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AS FASHIONS | Online Shopping for Men, Women & Kids</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Myntra Style Navbar -->
    <header class="navbar">
        <div class="logo-container">
            <a href="index.html" class="logo">AS FASHIONS</a>
            <nav class="nav-links">
                <a href="pages/men.html">Men</a>
                <a href="pages/women.html">Women</a>
                <a href="pages/kids.html">Kids</a>
                <a href="pages/footwear.html">Footwear</a>
                <a href="pages/accessories.html">Accessories</a>
                <a href="pages/beauty.html">Beauty</a>
            </nav>
        </div>

        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search for products, brands and more">
        </div>

        <div class="nav-actions">
            <a href="pages/profile.html" class="action-item">
                <i class="fa-regular fa-user"></i>
                <span>Profile</span>
            </a>
            <a href="pages/wishlist.html" class="action-item">
                <i class="fa-regular fa-heart"></i>
                <span>Wishlist</span>
                <span class="badge">0</span>
            </a>
            <a href="pages/cart.html" class="action-item">
                <i class="fa-solid fa-bag-shopping"></i>
                <span>Bag</span>
                <span class="badge">0</span>
            </a>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="hero-banner">
        <div class="banner-content">
            <h1>FLAT 50% OFF</h1>
            <p>On Trending Styles & Premium Collections</p>
            <button class="shop-btn">Explore Now</button>
        </div>
    </section>

    <!-- Medal/Myntra Style Circular Categories -->
    <h2 class="section-title">Shop By Category</h2>
    <div class="categories-grid">
        <a href="pages/men.html" class="category-circle-card">
            <div class="category-img-box">
                <!-- Placeholder/Image -->
            </div>
            <span>Men</span>
        </a>
        <a href="pages/women.html" class="category-circle-card">
            <div class="category-img-box"></div>
            <span>Women</span>
        </a>
        <a href="pages/kids.html" class="category-circle-card">
            <div class="category-img-box"></div>
            <span>Kids</span>
        </a>
        <a href="pages/footwear.html" class="category-circle-card">
            <div class="category-img-box"></div>
            <span>Footwear</span>
        </a>
        <a href="pages/accessories.html" class="category-circle-card">
            <div class="category-img-box"></div>
            <span>Accessories</span>
        </a>
        <a href="pages/beauty.html" class="category-circle-card">
            <div class="category-img-box"></div>
            <span>Beauty</span>
        </a>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 AS FASHIONS. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
