<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .success-page {
    max-width: 550px;
    margin: 60px auto;
    text-align: center;
    padding: 40px 24px;
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
  }
  .success-icon {
    width: 64px;
    height: 64px;
    background: #dcfce7;
    color: #16a34a;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 28px;
    margin-bottom: 20px;
  }
  .success-page h1 {
    font-size: 24px;
    color: #0f172a;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .success-page p {
    color: #64748b;
    font-size: 14px;
    margin: 4px 0;
  }
  .success-actions {
    margin-top: 30px;
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .btn-primary {
    background: #0f172a;
    color: #ffffff;
    padding: 12px 24px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
  }
  .btn-add {
    border: 1.5px solid #cbd5e1;
    background: #ffffff;
    color: #334155;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    text-decoration: none;
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="success-page">
  <div class="success-icon">&#10003;</div>
  <h1>Order Placed Successfully!</h1>
  <p id="orderIdText">Your order has been confirmed.</p>
  <p>You'll receive updates as your order is packed and shipped.</p>
  <div class="success-actions">
    <a href="order-tracking.html" id="trackOrderLink" class="btn btn-primary">Track Order</a>
    <a href="index.html" class="btn-add" style="padding:11px 22px; display:inline-block;">Continue Shopping</a>
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var ui = window.ASF.ui;
  var id = ui.getQueryParam('id');
  if (id) {
    document.getElementById('orderIdText').textContent = 'Order #' + id + ' has been confirmed.';
    document.getElementById('trackOrderLink').href = 'order-tracking.html?id=' + encodeURIComponent(id);
  }
})();
</script>
</body>
</html>
