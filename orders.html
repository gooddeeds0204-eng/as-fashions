<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/checkout.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="account-layout">
  <nav class="account-nav">
    <a href="profile.html">My Profile</a>
    <a href="orders.html" class="active">My Orders</a>
    <a href="addresses.html">Addresses</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="returns.html">Returns</a>
    <a href="help.html">Help</a>
  </nav>
  <div>
    <h1 style="font-family:var(--font-display); font-size:22px; margin:0 0 18px;">My Orders</h1>
    <div id="ordersList"></div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var ordersApi = window.ASF.orders;
  var ui = window.ASF.ui;

  function render() {
    var orders = ordersApi.getOrders();
    var el = document.getElementById('ordersList');
    if (!orders.length) {
      el.innerHTML = '<div class="order-card" style="text-align:center; padding:40px 20px;"><p style="font-size:14px; margin-bottom:14px;">No orders yet.</p><a href="index.html" class="btn btn-primary">Start Shopping</a></div>';
      return;
    }
    el.innerHTML = orders.map(function (o) {
      var itemNames = o.items.map(function (i) { return i.product ? i.product.name : ''; }).filter(Boolean).join(', ');
      var date = new Date(o.placedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      return '<a href="order-tracking.html?id=' + o.id + '" class="order-card" style="display:block; text-decoration:none; color:inherit;">' +
        '<div class="order-card-head">' +
          '<div><p class="order-id">Order #' + o.id + '</p><p class="order-date">Placed on ' + date + '</p></div>' +
          '<span class="order-status-pill' + (o.status === 'Cancelled' ? ' cancelled' : '') + '">' + o.status + '</span>' +
        '</div>' +
        '<p class="order-items-preview">' + itemNames + '</p>' +
        '<div class="order-card-foot"><span class="order-total">' + ui.money(o.total) + '</span><span style="font-size:12px; color:var(--marigold-deep); font-weight:600;">Track order &rarr;</span></div>' +
      '</a>';
    }).join('');
  }

  render();
})();
</script>
</body>
</html>
