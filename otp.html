<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify OTP — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="auth-page">
  <div class="auth-card">
    <h1>Verify your account</h1>
    <div id="otpRequestStep" style="display:none;">
      <p class="sub">Enter your registered email or phone to receive an OTP.</p>
      <input type="text" id="otpIdentifierInput" placeholder="Email or phone" style="width:100%; padding:11px; border:1px solid var(--line); border-radius:2px; font-size:13px; margin:14px 0; font-family:inherit;">
      <button id="sendOtpBtn" class="btn btn-primary" style="width:100%; padding:13px;">Send OTP</button>
    </div>
    <div id="otpVerifyStep" style="display:none;">
      <p class="sub" id="otpSubtext">We've sent a 4-digit code to your email/phone.</p>
      <div class="demo-otp-note" id="demoOtpNote"></div>
      <div class="otp-inputs">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
        <input type="text" maxlength="1" inputmode="numeric" class="otp-digit">
      </div>
      <p class="auth-error" id="otpError"></p>
      <button id="verifyBtn" class="btn btn-primary" style="width:100%; padding:13px;">Verify &amp; Continue</button>
      <br>
      <a href="#" id="resendLink" class="resend-link">Resend OTP</a>
    </div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var authApi = window.ASF.auth;
  var params = new URLSearchParams(window.location.search);
  var identifier = params.get('identifier') || '';
  var demoOtp = params.get('demo_otp') || '';

  var requestStep = document.getElementById('otpRequestStep');
  var verifyStep = document.getElementById('otpVerifyStep');

  function showVerifyStep(id, otp) {
    identifier = id;
    requestStep.style.display = 'none';
    verifyStep.style.display = 'block';
    document.getElementById('otpSubtext').textContent = 'We\u2019ve sent a 4-digit code to ' + identifier;
    document.getElementById('demoOtpNote').textContent = 'Demo mode (no real SMS/email backend) \u2014 your OTP is: ' + otp;
    var firstDigit = document.querySelector('.otp-digit');
    if (firstDigit) firstDigit.focus();
  }

  if (identifier && demoOtp) {
    showVerifyStep(identifier, demoOtp);
  } else {
    requestStep.style.display = 'block';
    document.getElementById('sendOtpBtn').addEventListener('click', function () {
      var val = document.getElementById('otpIdentifierInput').value.trim();
      if (!val) return;
      var user = authApi.findUserByPhoneOrEmail(val);
      if (!user) { alert('No account found with that email/phone. Please register first.'); return; }
      var otp = authApi.requestOtp(val);
      showVerifyStep(val, otp);
    });
  }

  var digits = document.querySelectorAll('.otp-digit');
  digits.forEach(function (input, i) {
    input.addEventListener('input', function () {
      input.value = input.value.replace(/[^0-9]/g, '');
      if (input.value && digits[i + 1]) digits[i + 1].focus();
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !input.value && digits[i - 1]) digits[i - 1].focus();
    });
  });

  function doVerify() {
    var code = Array.from(digits).map(function (d) { return d.value; }).join('');
    var errEl = document.getElementById('otpError');
    if (code.length !== 4) {
      errEl.textContent = 'Enter all 4 digits.';
      errEl.style.display = 'block';
      return;
    }
    var result = authApi.verifyOtp(identifier, code);
    if (!result.valid) {
      errEl.textContent = result.message;
      errEl.style.display = 'block';
      return;
    }
    var loginResult = authApi.loginWithOtpOnly(identifier);
    if (!loginResult.success) {
      errEl.textContent = loginResult.message;
      errEl.style.display = 'block';
      return;
    }
    window.location.href = 'profile.html';
  }

  document.getElementById('verifyBtn').addEventListener('click', doVerify);
  document.getElementById('resendLink').addEventListener('click', function (e) {
    e.preventDefault();
    var newOtp = authApi.requestOtp(identifier);
    document.getElementById('demoOtpNote').textContent = 'New OTP sent (demo): ' + newOtp;
  });
})();
</script>
</body>
</html>
