<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - AS Fashions</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0f19;
            --surface: rgba(30, 41, 59, 0.7);
            --primary: #ec4899;
            --secondary: #8b5cf6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.2rem 5%; background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(16px); border-bottom: 1px solid var(--border);
        }
        .logo { font-size: 1.6rem; font-weight: 800; background: linear-gradient(135deg, #ec4899, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .details-container {
            max-width: 1200px; margin: 4rem auto; padding: 0 5%;
            display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; align-items: center;
        }
        .img-box {
            width: 100%; height: 500px; border-radius: 24px; overflow: hidden;
            border: 1px solid var(--border); background: var(--surface);
        }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .info-box h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        .info-box .price { font-size: 2rem; font-weight: 800; color: var(--primary); margin-bottom: 1.5rem; display: block; }
        .info-box p { color: var(--text-muted); line-height: 1.6; margin-bottom: 2rem; }
        
        .sizes { display: flex; gap: 1rem; margin-bottom: 2rem; }
        .size-btn {
            background: var(--surface); border: 1px solid var(--border);
            color: white; padding: 0.8rem 1.2rem; border-radius: 12px; cursor: pointer; font-weight: 700; transition: 0.3s;
        }
        .size-btn:hover, .size-btn.selected { border-color: var(--primary); background: rgba(236,72,153,0.1); }
        
        .cta-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none; width: 100%; padding: 1rem; border-radius: 14px;
            color: white; font-weight: 800; font-size: 1.1rem; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
        }
        .cta-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(236, 72, 153, 0.5); }

        @media(max-width: 768px) { .details-container { grid-template-columns: 1fr; gap: 2rem; } }
    </style>
</head>
<body>

    <header>
        <div class="logo">AS FASHIONS</div>
        <a href="products.html" style="color: var(--text-muted); text-decoration: none; font-weight: 600;">← Back to Shop</a>
    </header>

    <div class="details-container" id="product-detail-view">
        <!-- Dynamically Loaded via URL parameters -->
    </div>

    <script src="products.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 1;
        const currentProd = products.find(p => p.id === productId) || products[0];

        document.getElementById("product-detail-view").innerHTML = `
            <div class="img-box">
                <img src="${currentProd.image}" alt="${currentProd.name}">
            </div>
            <div class="info-box">
                <span style="color: var(--secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 1px;">${currentProd.category} Collection</span>
                <h1>${currentProd.name}</h1>
                <span class="price">₹${currentProd.price}</span>
                <p>Crafted with elite fabrics, designed for supreme comfort and standout streetwear vibes. Standard fit tailored for the modern trendsetters.</p>
                
                <label style="display:block; margin-bottom: 0.8rem; font-weight: 700;">Select Size:</label>
                <div class="sizes">
                    <button class="size-btn selected">S</button>
                    <button class="size-btn">M</button>
                    <button class="size-btn">L</button>
                    <button class="size-btn">XL</button>
                </div>
                
                <button class="cta-btn" onclick="addToCart(${currentProd.id})">⚡ Add to Cart Now</button>
            </div>
        `;
    </script>
</body>
</html>
