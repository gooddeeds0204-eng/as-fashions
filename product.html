<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — AS FASHIONS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/product.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div id="siteHeader"></div>

  <nav class="breadcrumb" id="pdpBreadcrumb"><a href="index.html">Home</a> / <span id="pdpCrumbCategory">Products</span> / <span id="pdpCrumbName">Details</span></nav>

  <main>
    <div class="pdp-layout" id="pdpLayout">
      <!-- Gallery Column -->
      <div>
        <div class="pdp-gallery-main">
          <img id="pdpMainImg" src="" alt="Product Image">
        </div>
        <div class="pdp-thumbs" id="pdpThumbs"></div>
      </div>

      <!-- Info Column -->
      <div class="pdp-info-panel">
        <h2 id="pdpBrand" class="pdp-brand">Brand</h2>
        <h1 id="pdpName" class="pdp-name">Product Name</h1>
        
        <div id="pdpRating" class="pdp-rating">4.3 &#9733; (1.2k Reviews)</div>

        <div class="pdp-price-row">
          <span id="pdpPrice" class="pdp-price">&#8377;0</span>
          <span id="pdpMrp" class="pdp-mrp">&#8377;0</span>
          <span id="pdpDiscount" class="pdp-discount">0% OFF</span>
        </div>

        <p class="best-price-tag" style="margin-bottom: 24px; font-size: 13px;">Inclusive of all taxes</p>

        <!-- Size Selection -->
        <div class="selector-group">
          <h4>Select Size</h4>
          <div id="pdpSizes" class="swatch-list"></div>
        </div>

        <!-- Color Selection -->
        <div class="selector-group">
          <h4>Select Color</h4>
          <div id="pdpColors" class="swatch-list"></div>
        </div>

        <!-- Quantity Stepper -->
        <div class="selector-group">
          <h4>Quantity</h4>
          <div class="qty-stepper">
            <button type="button" id="qtyDecBtn">-</button>
            <span id="pdpQty">1</span>
            <button type="button" id="qtyIncBtn">+</button>
          </div>
        </div>

        <!-- CTA Buttons -->
        <div class="pdp-actions">
          <button id="pdpAddToCartBtn" class="btn btn-primary btn-add">&#128092; Add to Bag</button>
          <button id="pdpWishlistBtn" class="pdp-wish-btn" aria-label="Wishlist">&#9825;</button>
        </div>

        <!-- Metadata Details -->
        <div class="pdp-meta-row">
          <p><strong>100% Original Guarantee</strong> &bull; Free Delivery on orders above &#8377;999 &bull; Easy 14 Days Return</p>
        </div>
      </div>
    </div>

    <!-- Related Products -->
    <section class="related-section">
      <h2>Similar Styles You May Like</h2>
      <div id="relatedProductGrid" class="product-grid"></div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="js/categories.js"></script>
  <script src="js/products.js"></script>
  <script src="js/offers.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/search.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/header.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
