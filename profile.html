<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<div id="siteHeader"></div>

<div class="account-layout">
  <nav class="account-nav">
    <a href="profile.html" class="active">My Profile</a>
    <a href="orders.html">My Orders</a>
    <a href="addresses.html">Addresses</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="returns.html">Returns</a>
    <a href="help.html">Help</a>
    <a href="#" id="logoutLink" class="danger">Logout</a>
  </nav>
  <div class="account-card" id="profileCard">
    <!-- filled by script -->
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var authApi = window.ASF.auth;

  function renderCard() {
    var user = authApi.getCurrentUser();
    var card = document.getElementById('profileCard');
    if (!user) {
      card.innerHTML = '<p style="font-size:14px;">You need to be logged in to view your profile.</p><a href="login.html" class="btn btn-primary" style="display:inline-block; margin-top:10px;">Login</a>';
      return;
    }
    card.innerHTML =
      '<h1>My Profile</h1>' +
      '<form id="profileForm">' +
        '<label>Full name</label><input type="text" id="pfName" value="' + user.name + '">' +
        '<label>Email</label><input type="email" id="pfEmail" value="' + user.email + '">' +
        '<label>Phone</label><input type="tel" id="pfPhone" value="' + user.phone + '">' +
        '<p class="save-msg" id="saveMsg">Saved!</p>' +
        '<button type="submit" class="btn btn-primary" style="padding:11px 24px;">Save Changes</button>' +
      '</form>';

    document.getElementById('profileForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var result = authApi.updateProfile({
        name: document.getElementById('pfName').value.trim(),
        email: document.getElementById('pfEmail').value.trim(),
        phone: document.getElementById('pfPhone').value.trim()
      });
      var msg = document.getElementById('saveMsg');
      if (result.success) {
        msg.style.display = 'block';
        setTimeout(function () { msg.style.display = 'none'; }, 2000);
      } else {
        alert(result.message);
      }
    });
  }

  document.getElementById('logoutLink').addEventListener('click', function (e) {
    e.preventDefault();
    authApi.logout();
    window.location.href = 'index.html';
  });

  renderCard();
})();
</script>
</body>
</html>
