<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .account-layout {
    max-width: 1000px;
    margin: 40px auto;
    padding: 0 16px;
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 30px;
  }
  .account-nav {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    height: fit-content;
  }
  .account-nav a {
    padding: 10px 14px;
    border-radius: 8px;
    text-decoration: none;
    color: #475569;
    font-size: 14px;
    font-weight: 500;
  }
  .account-nav a.active, .account-nav a:hover {
    background: #f1f5f9;
    color: #0f172a;
    font-weight: 600;
  }
  .account-nav a.danger {
    color: #ef4444;
  }
  .account-card {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 30px;
  }
  .account-card h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 20px;
    color: #0f172a;
  }
  .account-card label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  .account-card input {
    width: 100%;
    padding: 11px 14px;
    border-radius: 8px;
    border: 1.5px solid #cbd5e1;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    box-sizing: border-box;
  }
  .account-card input:focus {
    border-color: #0f172a;
  }
  .save-msg {
    display: none;
    color: #16a34a;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 12px;
  }
  @media(max-width: 768px) {
    .account-layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="account-layout">
  <nav class="account-nav">
    <a href="profile.html" class="active">My Profile</a>
    <a href="orders.html">My Orders</a>
    <a href="addresses.html">Addresses</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="returns.html">Returns</a>
    <a href="help.html">Help</a>
    <a href="#" id="logoutLink" class="danger">Logout</a>
  </nav>
  <div class="account-card" id="profileCard">
    </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var authApi = window.ASF.auth;

  function renderCard() {
    var user = authApi.getCurrentUser();
    var card = document.getElementById('profileCard');
    if (!user) {
      card.innerHTML = '<p style="font-size:14px; color:#64748b;">You need to be logged in to view your profile.</p><a href="login.html" class="btn btn-primary" style="display:inline-block; margin-top:10px; padding:10px 20px; text-decoration:none;">Login</a>';
      return;
    }
    card.innerHTML =
      '<h1>My Profile</h1>' +
      '<form id="profileForm">' +
        '<label>Full name</label><input type="text" id="pfName" value="' + user.name + '">' +
        '<label>Email</label><input type="email" id="pfEmail" value="' + user.email + '">' +
        '<label>Phone</label><input type="tel" id="pfPhone" value="' + user.phone + '">' +
        '<p class="save-msg" id="saveMsg">Saved!</p>' +
        '<button type="submit" class="btn btn-primary" style="padding:11px 24px; cursor:pointer;">Save Changes</button>' +
      '</form>';

    document.getElementById('profileForm').addEventListener('submit', function (e) {
      e.preventDefault();
      var result = authApi.updateProfile({
        name: document.getElementById('pfName').value.trim(),
        email: document.getElementById('pfEmail').value.trim(),
        phone: document.getElementById('pfPhone').value.trim()
      });
      var msg = document.getElementById('saveMsg');
      if (result.success) {
        msg.style.display = 'block';
        setTimeout(function () { msg.style.display = 'none'; }, 2000);
      } else {
        alert(result.message);
      }
    });
  }

  document.getElementById('logoutLink').addEventListener('click', function (e) {
    e.preventDefault();
    authApi.logout();
    window.location.href = 'index.html';
  });

  renderCard();
})();
</script>
</body>
</html>
