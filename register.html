<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — AS FASHIONS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  .auth-page {
    min-height: calc(100vh - 140px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
    background: #f8fafc;
  }
  .auth-card {
    background: #ffffff;
    width: 100%;
    max-width: 440px;
    padding: 36px 32px;
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    border: 1px solid #e2e8f0;
  }
  .auth-card h1 {
    font-size: 26px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 6px 0;
  }
  .auth-card .sub {
    font-size: 14px;
    color: #64748b;
    margin-bottom: 24px;
  }
  .auth-card label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
  }
  .auth-card input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid #cbd5e1;
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    transition: all 0.2s ease;
    box-sizing: border-box;
  }
  .auth-card input:focus {
    border-color: #0f172a;
    box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
  }
  .btn-primary {
    background: #0f172a;
    color: #ffffff;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .btn-primary:hover {
    background: #1e293b;
  }
  .auth-links {
    margin-top: 24px;
    text-align: center;
    font-size: 13px;
    color: #64748b;
  }
  .auth-links a {
    color: #0f172a;
    font-weight: 600;
    text-decoration: none;
  }
  .auth-links a:hover { text-decoration: underline; }
  .auth-error {
    color: #ef4444;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
</style>
</head>
<body>

<div id="siteHeader"></div>

<div class="auth-page">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Join AS Fashions for faster checkout &amp; order tracking</p>
    <form id="registerForm">
      <label>Full name</label>
      <input type="text" id="regName" required>
      <label>Email</label>
      <input type="email" id="regEmail" required>
      <label>Phone</label>
      <input type="tel" id="regPhone" required>
      <label>Password</label>
      <input type="password" id="regPassword" minlength="4" required>
      <p class="auth-error" id="registerError"></p>
      <button type="submit" class="btn btn-primary" style="width:100%; padding:13px;">Create Account</button>
    </form>
    <div class="auth-links">Already have an account? <a href="login.html">Login</a></div>
  </div>
</div>

<div id="siteFooter"></div>

<script src="js/categories.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/wishlist.js"></script>
<script src="js/search.js"></script>
<script src="js/filters.js"></script>
<script src="js/offers.js"></script>
<script src="js/auth.js"></script>
<script src="js/orders.js"></script>
<script src="js/reviews.js"></script>
<script src="js/notifications.js"></script>
<script src="js/ui.js"></script>
<script src="js/header.js"></script>
<script>
(function () {
  'use strict';
  var authApi = window.ASF.auth;

  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var data = {
      name: document.getElementById('regName').value.trim(),
      email: document.getElementById('regEmail').value.trim(),
      phone: document.getElementById('regPhone').value.trim(),
      password: document.getElementById('regPassword').value
    };
    var result = authApi.register(data);
    var errEl = document.getElementById('registerError');
    if (!result.success) {
      errEl.textContent = result.message;
      errEl.style.display = 'block';
      return;
    }
    var otp = authApi.requestOtp(data.email);
    window.location.href = 'otp.html?identifier=' + encodeURIComponent(data.email) + '&demo_otp=' + otp;
  });
})();
</script>
</body>
</html>
